<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --pink: #ff4da6;
    --pink-light: #ff80c0;
    --pink-deep: #e0006e;
    --crimson: #ff2a5f;
    --gold: #ffd700;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #0b000c;
  }

  /* ── Animated gradient sky (Valentine Theme) ── */
  .sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg,
      #1f001a 0%, #3d002e 20%, #6b003a 40%,
      #9e0047 60%, #d60057 80%, #ff2a5f 100%);
    animation: skyShift 8s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes skyShift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    50%  { filter: hue-rotate(10deg) brightness(1.1); }
    100% { filter: hue-rotate(-10deg) brightness(0.9); }
  }

  /* ── Sparkling stars ── */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.4); }
  }

  /* ── Floating balloons & hearts ── */
  .balloons {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  .balloon {
    position: absolute;
    bottom: -120px;
    font-size: clamp(2rem, 5vw, 3.5rem);
    animation: floatUp var(--dur2) ease-in-out infinite var(--delay2);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-5deg); opacity: 0; }
    10%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(8deg); opacity: 0; }
  }

  /* ── Hanging Hearts (Replacing Lanterns) ── */
  .lantern {
    position: absolute;
    font-size: clamp(1.5rem, 3vw, 2.5rem);
    animation: sway 3s ease-in-out infinite var(--sw-delay);
    transform-origin: top center;
    filter: drop-shadow(0 2px 8px rgba(255,42,95,0.4));
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50%       { transform: rotate(8deg); }
  }

  /* ── Main card ── */
  .card-wrap {
    position: relative;
    z-index: 10;
    width: min(92vw, 600px);
    padding: 20px;
  }

  .card {
    background: var(--glass-bg);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border: 1.5px solid var(--glass-border);
    border-radius: 32px;
    padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px);
    box-shadow:
      0 8px 64px rgba(255, 42, 95, 0.25),
      0 2px 0 rgba(255,255,255,0.12) inset,
      0 -2px 0 rgba(0,0,0,0.1) inset;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: cardPulse 4s ease-in-out infinite;
  }
  @keyframes cardPulse {
    0%, 100% { box-shadow: 0 8px 64px rgba(255,42,95,0.25), 0 2px 0 rgba(255,255,255,0.12) inset; }
    50%       { box-shadow: 0 12px 80px rgba(255,42,95,0.4), 0 2px 0 rgba(255,255,255,0.18) inset; }
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg,
      transparent 0%, rgba(255,255,255,0.05) 40%,
      rgba(255,255,255,0.1) 50%, transparent 60%);
    animation: shimmer 3.5s linear infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  /* ── Title ── */
  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    font-weight: 900;
    background: linear-gradient(135deg, #ff4da6, #ff80c0, #ff2a5f, #b3003b);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGlow 2.5s ease-in-out infinite alternate;
    line-height: 1.2;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(255,42,95,0.5));
  }
  @keyframes titleGlow {
    0%   { background-position: 0% 50%; filter: drop-shadow(0 0 8px rgba(255,42,95,0.4)); }
    100% { background-position: 100% 50%; filter: drop-shadow(0 0 22px rgba(255,42,95,0.8)); }
  }

  /* ── Valentine badge ── */
  .eid-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff2a5f, #ff758c);
    color: #fff;
    font-size: clamp(0.75rem, 2.5vw, 0.9rem);
    font-weight: 800;
    padding: 6px 20px;
    border-radius: 50px;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 4px 16px rgba(255,42,95,0.4);
    animation: badgePop 1.2s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes badgePop {
    from { transform: scale(0) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ── Question ── */
  .question {
    font-size: clamp(1.2rem, 4.2vw, 1.65rem);
    font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.6;
    margin-bottom: 36px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    animation: fadeSlide 0.8s 0.3s ease both;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    position: relative;
    min-height: 80px;
  }

  .btn {
    flex: 1;
    max-width: 180px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }

  /* yes button */
  .btn-yes {
    background: linear-gradient(135deg, #ff2a5f 0%, #e0006e 50%, #ff2a5f 100%);
    background-size: 200%;
    color: #fff;
    box-shadow: 0 6px 30px rgba(255, 42, 95, 0.55);
    animation: yesBreath 2s ease-in-out infinite;
  }
  .btn-yes:hover {
    transform: scale(1.08) translateY(-3px);
    box-shadow: 0 12px 40px rgba(255, 42, 95, 0.75);
    background-position: right center;
  }
  .btn-yes:active { transform: scale(0.96); }
  @keyframes yesBreath {
    0%, 100% { box-shadow: 0 6px 30px rgba(255,42,95,0.55); }
    50%       { box-shadow: 0 6px 44px rgba(255,42,95,0.85); }
  }

  /* no button */
  .btn-no {
    background: linear-gradient(135deg, #333 0%, #1a1a1a 100%);
    color: rgba(255,255,255,0.6);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    position: absolute;
    transition: left 0.08s ease-out, top 0.08s ease-out, transform 0.18s;
  }

  /* ── Decorative divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 28px;
    color: rgba(255,255,255,0.25);
    font-size: 1.2rem;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  /* ── Bouncing heart corner ── */
  .sheep-corner {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: clamp(2.5rem, 6vw, 4rem);
    z-index: 20;
    animation: heartBounce 0.6s ease-in-out infinite alternate;
    filter: drop-shadow(0 4px 12px rgba(255,42,95,0.4));
    cursor: default;
  }
  @keyframes heartBounce {
    0%   { transform: translateY(0) scale(1) rotate(-5deg); }
    100% { transform: translateY(-15px) scale(1.1) rotate(5deg); }
  }

  /* ── Sparkle decoration ── */
  .moon {
    position: fixed;
    top: 24px;
    right: 28px;
    font-size: clamp(2rem, 5vw, 3rem);
    z-index: 20;
    animation: moonFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(255,215,0,0.6));
  }
  @keyframes moonFloat {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50%       { transform: translateY(-12px) rotate(10deg); }
  }

  /* ── Festive dots ── */
  .sprinkle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    animation: sprinkleFloat var(--sp-dur) ease-in-out infinite var(--sp-delay) alternate;
  }
  @keyframes sprinkleFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.4; }
    100% { transform: translateY(-30px) rotate(180deg); opacity: 0.9; }
  }

  /* ── Success overlay ── */
  .success-msg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 0, 12, 0.8);
    backdrop-filter: blur(12px);
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.4s ease;
  }
  .success-msg.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .success-inner {
    background: linear-gradient(135deg, #24001c, #4a002b);
    border: 2px solid var(--glass-border);
    border-radius: 28px;
    padding: 48px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 0 80px rgba(255,42,95,0.5);
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .success-inner p {
    font-size: clamp(1.3rem, 4.5vw, 1.8rem);
    font-weight: 800;
    color: #fff;
    line-height: 1.6;
    text-shadow: 0 0 20px rgba(255,42,95,0.6);
    margin-bottom: 24px;
  }
  .close-btn {
    background: linear-gradient(135deg, #ff2a5f, #e0006e);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 12px 36px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,0,110,0.5);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .close-btn:hover { transform: scale(1.07); box-shadow: 0 8px 32px rgba(255,0,110,0.7); }
</style>
</head>
<body>

<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="balloons" id="balloons"></div>
<div id="sprinkles"></div>

<!-- Sparkles instead of Moon -->
<div class="moon">✨</div>

<!-- Bouncing Heart instead of Sheep -->
<div class="sheep-corner">💖</div>

<div class="card-wrap">
  <!-- Hanging Hearts above the card -->
  <div style="display:flex; justify-content:space-between; padding:0 20px; margin-bottom:8px;">
    <div class="lantern" style="--sw-delay:0s">❤️</div>
    <div class="lantern" style="--sw-delay:0.5s">💕</div>
    <div class="lantern" style="--sw-delay:1s">💖</div>
    <div class="lantern" style="--sw-delay:1.5s">💕</div>
    <div class="lantern" style="--sw-delay:0.8s">❤️</div>
  </div>

  <div class="card">
    <div class="eid-badge">✨ Valentine's Day ✨</div>
    <div class="title">Hey You Story 🌸</div>

    <div class="divider">
      <div class="divider-line"></div>
      <span>💖</span>
      <div class="divider-line"></div>
    </div>

    <div class="question">
      Will you make me the happiest person and be my Valentine? 🥺👑
    </div>

    <!-- Buttons (Adjusted for LTR layout) -->
    <div class="btn-row" id="btnRow">
      <button class="btn btn-yes" onclick="onYes()">Yes, I'd love to! 😍</button>
      <button
        class="btn btn-no"
        id="noBtn"
        onmouseover="escapeBtn(event)"
        ontouchstart="escapeBtnTouch(event)"
        onclick="return false;"
      >No 🏃‍♂️</button>
    </div>
  </div>
</div>

<!-- Success overlay -->
<div class="success-msg" id="successMsg">
  <div class="success-inner">
    <div style="font-size:3.5rem; margin-bottom:16px;">❤️🎈🥳💖</div>
    <p>Yay! Best Valentine Ever! <br>You just made my day! 🥰🌹✨</p>
    <button class="close-btn" onclick="closeSuccess()">Forever & Always 💖</button>
  </div>
</div>

<script>
/* ── Stars ── */
(function(){
  const c = document.getElementById('stars');
  for(let i=0; i<120; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+1;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --dur:${1.5+Math.random()*3}s;
      --delay:${Math.random()*4}s;
    `;
    c.appendChild(s);
  }
})();

/* ── Floating Hearts and Balloons ── */
(function(){
  const emojis = ['🎈','💖','❤️','💕','✨','🌸','💝','🎀'];
  const c = document.getElementById('balloons');
  for(let i=0; i<18; i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    b.style.cssText = `
      left:${Math.random()*100}%;
      --dur2:${6+Math.random()*10}s;
      --delay2:${Math.random()*12}s;
    `;
    c.appendChild(b);
  }
})();

/* ── Sprinkles ── */
(function(){
  const colors=['#ff4da6','#ffd700','#ff2a5f','#40c4ff','#e040fb','#ff6d00'];
  const c = document.getElementById('sprinkles');
  for(let i=0; i<30; i++){
    const s = document.createElement('div');
    s.className = 'sprinkle';
    const sz = 4+Math.random()*8;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --sp-dur:${2+Math.random()*3}s;
      --sp-delay:${Math.random()*3}s;
    `;
    c.appendChild(s);
  }
})();

/* ── No button escape (Fixed for LTR Layout) ── */
const noBtn = document.getElementById('noBtn');
const row   = document.getElementById('btnRow');

function getRandomPos() {
  const rW = row.offsetWidth;
  const rH = row.offsetHeight;
  const bW = noBtn.offsetWidth;
  const bH = noBtn.offsetHeight;
  
  const cardW = document.querySelector('.card-wrap').offsetWidth;
  const maxX = Math.min(rW - bW, cardW - bW - 30);
  const x = Math.floor(Math.random() * Math.max(maxX, bW));
  const yRange = 160; 
  const y = Math.floor(Math.random() * yRange) - yRange/2;
  return { x, y };
}

let noBtnX = null, noBtnY = null;

function initNoBtnPos() {
  if (noBtnX === null) {
    const yesBtn = row.querySelector('.btn-yes');
    const yesBtnRect = yesBtn.getBoundingClientRect();
    const rowRect = row.getBoundingClientRect();
    
    // Positioned logically on the right side of the Yes button for standard LTR flow
    noBtnX = yesBtnRect.left - rowRect.left + yesBtn.offsetWidth + 20;
    noBtnY = (rowRect.height - noBtn.offsetHeight) / 2;
    noBtn.style.left = noBtnX + 'px';
    noBtn.style.top  = noBtnY + 'px';
  }
}

window.addEventListener('load', () => {
  row.style.position = 'relative';
  noBtn.style.position = 'absolute';
  initNoBtnPos();
  noBtn.style.left = noBtnX + 'px';
  noBtn.style.top  = noBtnY + 'px';
  const yesH = row.querySelector('.btn-yes').offsetHeight;
  row.style.minHeight = (yesH + 60) + 'px';
});

function escapeBtn(e) {
  const pos = getRandomPos();
  noBtnX = pos.x;
  noBtnY = pos.y;
  noBtn.style.left = noBtnX + 'px';
  noBtn.style.top  = noBtnY + 'px';
}

function escapeBtnTouch(e) {
  e.preventDefault();
  escapeBtn(e);
}

/* ── Yes button ── */
function onYes() {
  const duration = 5000;
  const end = Date.now() + duration;
  const colors = ['#ff4da6','#ffd700','#ff2a5f','#40c4ff','#e040fb','#fff'];

  function frame() {
    confetti({
      particleCount: 12,
      angle: 60,
      spread: 80,
      origin: { x: 0, y: 0.6 },
      colors,
      scalar: 1.3,
    });
    confetti({
      particleCount: 12,
      angle: 120,
      spread: 80,
      origin: { x: 1, y: 0.6 },
      colors,
      scalar: 1.3,
    });
    if (Date.now() < end) requestAnimationFrame(frame);
  }

  confetti({
    particleCount: 180,
    spread: 120,
    origin: { x: 0.5, y: 0.55 },
    colors,
    scalar: 1.5,
    startVelocity: 55,
    gravity: 0.85,
    ticks: 300,
  });
  
  confetti({
    particleCount: 100,
    spread: 360,
    startVelocity: 30,
    origin: { x: 0.5, y: 0.5 },
    colors,
    scalar: 1.2,
    shapes: ['star'],
  });

  frame();

  setTimeout(() => {
    document.getElementById('successMsg').classList.add('show');
    confetti({ particleCount: 120, spread: 80, origin: { x: 0.5, y: 0.4 }, colors, scalar: 1.4 });
  }, 400);
}

function closeSuccess() {
  document.getElementById('successMsg').classList.remove('show');
  confetti({ particleCount: 60, spread: 60, origin: { x: 0.5, y: 0.6 }, colors:['#ff4da6','#ff2a5f'] });
}
</script>
</body>
</html>
